<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="pinfold-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pinfold-cyan" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#pinfold-grad)" filter="url(#shadow)" />
  
  <!-- Background Tab Card -->
  <rect x="36" y="24" width="56" height="24" rx="8" fill="#A5B4FC" opacity="0.85" />
  
  <!-- Main Foreground Tab Card -->
  <rect x="24" y="38" width="80" height="62" rx="12" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Tab Card Title Pill -->
  <rect x="36" y="52" width="48" height="8" rx="4" fill="url(#pinfold-cyan)" />
  
  <!-- Tab Card Subtitle Pill -->
  <rect x="36" y="68" width="32" height="7" rx="3.5" fill="#E2E8F0" />
  
  <!-- Tab Card Check Dot -->
  <circle cx="86" cy="72" r="5" fill="#10B981" />
</svg>
