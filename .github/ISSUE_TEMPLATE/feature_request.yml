name: Feature request
description: Suggest an idea or improvement for Pinfold.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first in case it has already been proposed.

        **Privacy is a core principle of Pinfold.** Features that add network requests, analytics or telemetry, accounts or cloud sync through a third-party server, or remotely loaded code will not be accepted. Everything must keep working locally, inside the extension.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: "I often ... and it is frustrating because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like Pinfold to do. Mockups or examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or thought about.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature works fully offline and does not need network requests, analytics, or remote code.
          required: true
